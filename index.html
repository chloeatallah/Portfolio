<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloé Atallah — Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- SoundCloud Widget API -->
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f0c;
      --panel-bg: rgba(15, 23, 17, 0.75);
      --panel-border: rgba(62, 92, 69, 0.4);
      --moss-accent: #4f7942;
      --moss-bright: #7fa976;
      --text-main: #e2e8e4;
      --text-muted: #809385;
      --font-sans: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Atmospheric Background */
    .bg-atmosphere {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 50% 30%, rgba(79, 121, 66, 0.28) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(15, 23, 17, 0.95) 0%, transparent 50%),
        linear-gradient(135deg, #0b0f0c 0%, #121a14 50%, #0b0f0c 100%);
    }

    .bg-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(62, 92, 69, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 92, 69, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Page Shell */
    .page-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px;
    }

    /* Header with Spaced Lettering */
    header.brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
    }

    /* 1. Spaced out letters on CHLOÉ ATALLAH */
    .brand-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* Reserved 3D Character Stage Slot */
    .character-3d-stage {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 180px;
      margin: 16px auto 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-placeholder-box {
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(127, 169, 118, 0.35);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(15, 23, 17, 0.45);
      backdrop-filter: blur(12px);
    }

    /* Centered Navigation */
    nav.main-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 24px 40px;
      margin: auto 0;
      padding: 32px 16px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      filter: drop-shadow(rgba(0, 0, 0, 0.75) 1.5px 1.5px 2px);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6.4px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: var(--moss-bright);
      transform: translateY(-2px);
    }

    .nav-btn span {
      font-family: var(--font-mono);
      font-size: 13.6px;
      color: var(--text-muted);
    }

    /* 4. About Me Text Panel */
    .about-text-container {
      display: none;
      max-width: 680px;
      margin: 0 auto 32px auto;
      padding: 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text-main);
    }

    .about-text-container.visible {
      display: block;
    }

    .about-text-container h4 {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--moss-bright);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Sub-Filter Buttons Panel */
    .sub-filter-panel {
      display: none;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: -16px;
      margin-bottom: 32px;
    }

    .sub-filter-panel.visible {
      display: flex;
    }

    .sub-btn {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 6.4px 13.6px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .sub-btn:hover,
    .sub-btn.active {
      color: var(--text-main);
      border-color: var(--moss-bright);
      background: rgba(79, 121, 66, 0.35);
    }

    /* Projects Grid Container */
    .projects-container {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .projects-container.visible {
      display: grid;
    }

    .project-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s;
    }

    .project-card:hover {
      border-color: var(--moss-bright);
      transform: translateY(-3px);
    }

    .card-preview {
      width: 100%;
      height: 200px;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--panel-border);
    }

    .card-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 11.2px;
      color: var(--moss-bright);
      text-transform: uppercase;
    }

    .card-info h3 {
      font-size: 16px;
      font-weight: 600;
    }

    /* Footer Wrapper */
    footer.site-footer {
      display
