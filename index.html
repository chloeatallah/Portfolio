<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloé Atallah — Portfolio</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f0c;
      --panel-bg: rgba(15, 23, 17, 0.65);
      --panel-border: rgba(62, 92, 69, 0.35);
      --moss-accent: #4f7942;
      --moss-bright: #7fa976;
      --text-main: #e2e8e4;
      --text-muted: #809385;
      --text-shadow: drop-shadow(1.5px 1.5px 2px rgba(0, 0, 0, 0.85));
      --font-sans: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --blur-val: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* --- Interactive Fullscreen Video / Motion Layer --- */
    .backdrop-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .backdrop-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      filter: grayscale(20%) contrast(110%);
    }

    .backdrop-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(11, 15, 12, 0.35) 0%, rgba(11, 15, 12, 0.92) 100%);
    }
