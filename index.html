<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloé Atallah — Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- SoundCloud Widget API -->
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f0c;
      --panel-bg: rgba(15, 23, 17, 0.75);
      --panel-border: rgba(62, 92, 69, 0.4);
      --moss-accent: #4f7942;
      --moss-bright: #7fa976;
      --text-main: #e2e8e4;
      --text-muted: #809385;
      --font-sans: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Atmospheric Background */
    .bg-atmosphere {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 50% 30%, rgba(79, 121, 66, 0.28) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(15, 23, 17, 0.95) 0%, transparent 50%),
        linear-gradient(135deg, #0b0f0c 0%, #121a14 50%, #0b0f0c 100%);
    }

    .bg-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(62, 92, 69, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 92, 69, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Page Wrapper */
    .page-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px;
    }

    /* 1. Header with Spaced Letters */
    header.brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
