<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloé Atallah — Portfolio</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f0c;
      --panel-bg: rgba(15, 23, 17, 0.75);
      --panel-border: rgba(62, 92, 69, 0.35);
      --moss-accent: #4f7942;
      --moss-bright: #7fa976;
      --text-main: #e2e8e4;
      --text-muted: #809385;
      --text-shadow: drop-shadow(1.5px 1.5px 2px rgba(0, 0, 0, 0.85));
      --font-sans: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --blur-val: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Motion Background Layer */
    .backdrop-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: 
        radial-gradient(circle at 20% 20%, rgba(79, 121, 66, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(15, 23, 17, 0.8) 0%, transparent 50%),
        var(--bg-dark);
    }

    /* Main Shell */
    .wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
    }

    /* Header */
    header.brand-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--panel-bg);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      transition: border-color 0.3s ease;
    }

    header.brand-nav:hover {
      border-color: rgba(127, 169, 118, 0.5);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .brand-alias {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--moss-bright);
      margin-left: 0.75rem;
    }

    /* Center Badge */
    .hat-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      color: var(--moss-bright);
      text-transform: uppercase;
      background: rgba(79, 121, 66, 0.15);
      border: 1px solid var(--panel-border);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

      background: rgba(79, 121, 66, 0.3);
      border-color: var(--moss-bright);
      box-shadow
